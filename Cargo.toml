[package]
name = "guiyux"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
windows-core = "0.62"
windows-numerics = "0.3"
windows = { version = "0.62", features = [
    "System", "UI_Composition_Desktop", "Win32_System_WinRT_Composition",
    "Win32_Graphics_Gdi", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_Ole",
    "Win32_System_SystemServices", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm", "Win32_UI_Accessibility", "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_LibraryLoader",
    "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_JobObjects", "Win32_System_StationsAndDesktops"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = "thin"
strip = true
